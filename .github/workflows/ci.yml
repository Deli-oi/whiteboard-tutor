name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:extension
      - run: npm run test
      - run: npm run build:extension
      - run: git diff --exit-code extension/*.js
        name: Verify committed build output matches source (run `npm run build:extension` and commit the result if this fails)
