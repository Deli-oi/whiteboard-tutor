<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Study Buddy — Visual Edit settings</title>
		<style>
			body {
				font: 14px/1.5 system-ui, sans-serif;
				max-width: 480px;
				margin: 32px auto;
				padding: 0 16px;
				color: #1a1a1a;
			}
			h1 {
				font-size: 18px;
			}
			label {
				display: block;
				font-weight: 600;
				margin-top: 16px;
			}
			input[type='password'],
			input[type='text'] {
				width: 100%;
				box-sizing: border-box;
				padding: 8px;
				margin-top: 6px;
				font: inherit;
				border: 1px solid #ccc;
				border-radius: 6px;
			}
			button {
				margin-top: 16px;
				padding: 8px 16px;
				font: inherit;
				border: none;
				border-radius: 6px;
				background: #1a1a1a;
				color: white;
				cursor: pointer;
			}
			p.hint {
				color: #666;
				font-size: 12px;
			}
			#status {
				margin-top: 12px;
				font-size: 13px;
			}
		</style>
	</head>
	<body>
		<h1>Study Buddy — Visual Edit</h1>
		<p class="hint">
			Generation runs entirely from your browser using your own Gemini API key - nothing is sent to a shared
			backend. Get a free key at
			<a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com</a>.
		</p>
		<label for="apiKey">Gemini API key</label>
		<input id="apiKey" type="password" autocomplete="off" placeholder="AIza..." />
		<button id="save">Save</button>
		<div id="status"></div>
		<script src="options.js"></script>
	</body>
</html>
