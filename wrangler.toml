name = "whiteboard-tutor"
main = "worker/worker.ts"
compatibility_date = "2024-12-30"
# Required by @sentry/cloudflare (worker/worker.ts) - it imports node:async_hooks
# and friends for its context-tracking internals. Nothing else here uses it.
compatibility_flags = ["nodejs_compat"]
assets = { not_found_handling = "single-page-application" }
preview_urls = true

[observability]
enabled = true

# Set up the durable object used for each tldraw room
[durable_objects]
bindings = [{ name = "AGENT_DURABLE_OBJECT", class_name = "AgentDurableObject" }]

# Durable objects require migrations to create/modify/delete them.
# SQLite-backed so it works on the free plan too.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDurableObject"]
